<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f4f1ea"/>
  <text x="40" y="42" font-family="ui-sans-serif, sans-serif" font-size="22" font-weight="700" fill="#1c1917">What this change does and does not do</text>

  <rect x="40" y="72" width="420" height="308" rx="14" fill="#e7f3ec" stroke="#1f6b4a"/>
  <text x="64" y="108" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#1f6b4a">Does</text>
  <text x="64" y="148" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Read ~/muse/food.md</text>
  <text x="64" y="176" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Read ~/muse/reply-style.md</text>
  <text x="64" y="204" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Read ~/muse/soul.md</text>
  <text x="64" y="232" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Print those notes</text>
  <text x="64" y="260" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Attach them to one send</text>
  <text x="64" y="288" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Ask Muse for one draft</text>
  <text x="64" y="340" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">You still place the order or send the text.</text>

  <rect x="500" y="72" width="420" height="308" rx="14" fill="#f8ebe8" stroke="#9f3a2f"/>
  <text x="524" y="108" font-family="ui-sans-serif, sans-serif" font-size="16" font-weight="700" fill="#9f3a2f">Does not</text>
  <text x="524" y="148" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Place a Swiggy order</text>
  <text x="524" y="176" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Send a chat for you</text>
  <text x="524" y="204" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Read any other path</text>
  <text x="524" y="232" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Watch the clipboard</text>
  <text x="524" y="260" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Use a laptop VPN for a board</text>
  <text x="524" y="288" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#1c1917">Speak on a gadget</text>
  <text x="524" y="340" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#57534e">This client has no command channel.</text>
</svg>
